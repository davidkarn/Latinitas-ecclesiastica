# Example server block: React build (web/dist) at /srv/learnlatin/web, generated API at /srv/learnlatin/api.
# Generate with `npm run generate -- --out /srv/learnlatin/api --gzip`; the swap is atomic,
# so no reload is needed after a new build.

server {
    listen 80;
    server_name learnlatin.example;

    root /srv/learnlatin/web;

    # Static JSON API
    location /api/ {
        root /srv/learnlatin;      # serves /srv/learnlatin/api/... (root, not alias: alias breaks try_files)
        default_type application/json;
        charset utf-8;
        charset_types application/json;

        gzip_static on;            # serve the .gz files written by --gzip
        gzip on;                   # fall back to on-the-fly compression
        gzip_types application/json;

        # Data changes only on regeneration; the frontend busts with ?v=<manifest.buildId>
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;

        try_files $uri =404;
    }

    location = /api/manifest.json {
        root /srv/learnlatin;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # React SPA: unknown paths fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
