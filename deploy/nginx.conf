# Example server block. web/dist holds the whole site: the React build plus the generated API in web/dist/api.
# Build with `npm run generate -- --gzip && npm run web:build`, then copy it to /srv/learnlatin/web with
# `DEPLOY_TARGET=host:/srv/learnlatin/web npm run deploy` (rsync). No reload is needed after a deploy.

server {
    listen 80;
    server_name learnlatin.example;

    root /srv/learnlatin/web;

    # Static JSON API
    location /api/ {
        default_type application/json;
        charset utf-8;
        charset_types application/json;

        gzip_static on;            # serve the .gz files written by --gzip
        gzip on;                   # fall back to on-the-fly compression
        gzip_types application/json;

        # Data changes only on regeneration; the frontend busts with ?v=<manifest.buildId>
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;

        try_files $uri =404;
    }

    location = /api/manifest.json {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # React SPA: unknown paths fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
